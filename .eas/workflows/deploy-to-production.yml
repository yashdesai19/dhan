# Every push to main: run the checks, then ship.
# - Native code unchanged (a build with this fingerprint exists): publish an over-the-air update.
#   Installed apps pick it up from the in-app update popup.
# - Native code changed (no build with this fingerprint): check that app.json "version" was raised,
#   then build a new APK. Publish it on the website with `npm run release:apk -- "notes"`; installed
#   apps then offer it from the same popup.
name: Deploy to production

on:
  push:
    branches: ['main']

jobs:
  check:
    name: Typecheck, lint, rules and tests
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run checks
        run: npm run check

  fingerprint:
    needs: [check]
    type: fingerprint
    environment: production

  get_android_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  check_version:
    name: Native change needs a higher version
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    steps:
      - uses: eas/checkout
      - name: Compare app.json version with the published APK
        run: node scripts/check-release-version.mjs

  build_android:
    needs: [check_version]
    type: build
    params:
      platform: android
      profile: production

  publish_android_update:
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      channel: production
      platform: android
