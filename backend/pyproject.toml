[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dhan-backend"
version = "0.1.0"
description = "DHAN Financial Platform Backend (FastAPI API + Django Admin + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "django>=5.1.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "django_admin"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
    "django_admin/**/migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (needed for FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"alembic/*" = ["E402"]
"django_admin/manage.py" = ["E402"]
"django_admin/config/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_app", "django_admin"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "alembic/versions/",
    ".venv/",
    "django_admin/",
]
