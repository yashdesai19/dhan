services:
  postgres:
    image: postgres:16-alpine
    container_name: dhan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dhan_db}
      POSTGRES_USER: ${POSTGRES_USER:-dhan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhan_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dhan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhan_user} -d ${POSTGRES_DB:-dhan_db}"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 2s

  fastapi:
    container_name: dhan_fastapi
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dhan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhan_password}
      POSTGRES_DB: ${POSTGRES_DB:-dhan_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dhan_user}:${POSTGRES_PASSWORD:-dhan_password}@postgres:5432/${POSTGRES_DB:-dhan_db}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dhan_user}:${POSTGRES_PASSWORD:-dhan_password}@postgres:5432/${POSTGRES_DB:-dhan_db}
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy

  django_admin:
    container_name: dhan_django_admin
    build:
      context: .
      dockerfile: Dockerfile
    command: python django_admin/manage.py runserver 0.0.0.0:8002
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dhan-django-insecure-secret-key-change-in-production-abcdef}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dhan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhan_password}
      POSTGRES_DB: ${POSTGRES_DB:-dhan_db}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dhan_postgres_data:
