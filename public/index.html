<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DHAN</title>
    <meta name="description" content="Track your money, budgets and shared expenses with DHAN." />
    <meta name="theme-color" content="#0B5D46" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DHAN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #0b5d46;
      }
      /* Fields draw their own focus border; the browser's outline doubled it */
      input,
      textarea {
        outline: none;
      }
      /* Keep autofilled fields in the app's colours instead of the browser's yellow or white */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: inherit;
        caret-color: inherit;
        transition: background-color 600000s 0s, color 600000s 0s;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script src="/register-sw.js" defer></script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run DHAN.</noscript>
    <div id="root"></div>
  </body>
</html>
