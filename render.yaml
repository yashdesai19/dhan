# Render blueprint for the DHAN API and its database (Dashboard → New → Blueprint → this repo).
# Secrets are generated by Render and never stored in the repo or the mobile app.
services:
  - type: web
    name: dhan-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Paid plans stay awake; a free web service sleeps and the app would time out on wake-up
    plan: starter
    region: singapore
    healthCheckPath: /health
    # Bring the schema up to date before each new version starts taking traffic
    preDeployCommand: alembic upgrade head
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dhan-db
          property: connectionString
      # The mobile app doesn't send an Origin; this only has to be an explicit list
      - key: FASTAPI_CORS_ORIGINS
        value: https://dhan-api.onrender.com
      # Requests reach the app through Render's proxy: take the client address from it, so
      # login rate limits apply per person rather than to everyone at once
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata

databases:
  - name: dhan-db
    # Free databases are deleted after 30 days; this plan keeps the data and daily backups
    plan: basic-256mb
    region: singapore
    databaseName: dhan
    user: dhan
    postgresMajorVersion: "16"
