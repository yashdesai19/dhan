# Render blueprint for the DHAN API (database lives on Supabase) (Dashboard → New → Blueprint → this repo).
# Secrets are generated by Render and never stored in the repo or the mobile app.
services:
  - type: web
    name: dhan-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Paid plans stay awake; a free web service sleeps and the app would time out on wake-up
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Supabase → Connect → Session pooler URI (IPv4; the direct host is IPv6-only and
      # Render can't reach it). Set in the dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      # The mobile app doesn't send an Origin; this only has to be an explicit list
      - key: FASTAPI_CORS_ORIGINS
        value: https://dhan-api.onrender.com
      # Requests reach the app through Render's proxy: take the client address from it, so
      # login rate limits apply per person rather than to everyone at once
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata

  # The web app / installable PWA. Static files on Render's CDN, so it never sleeps.
  - type: web
    name: dhan-web
    runtime: static
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    buildFilter:
      ignoredPaths:
        - backend/**
    envVars:
      - key: EXPO_PUBLIC_DHAN_API_URL
        value: https://dhan-api-jqfp.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://dhan-api-jqfp.onrender.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /sw.js
        name: Cache-Control
        value: no-cache
